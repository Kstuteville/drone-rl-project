# Training config for PPODroneControllerV2 / DroneBodyV2
# Behavior name must match the "Behavior Name" field on the PPODroneControllerV2 component in Unity.
#
# Train from scratch:
#   mlagents-learn config/drone_training_v2.yaml --run-id=DroneStage4_MotorFailure
#
# Fine-tune from best existing model (recommended — saves ~5M steps):
#   mlagents-learn config/drone_training_v2.yaml --run-id=DroneStage4_MotorFailure --initialize-from=reward_optimal4
#
# Resume interrupted run:
#   mlagents-learn config/drone_training_v2.yaml --run-id=DroneStage4_MotorFailure --resume
#
# Key changes vs drone_training.yaml:
#   - Behavior name is DroneAgentV2 (matches V2 component in Unity)
#   - Stage4_MotorFailure is now actually trained (DroneBodyV2.ApplyDomainRandomizationForEpisode implements it)
#   - Motor outputs encode dead motor as -1.0 sentinel (obs space still 23, no YAML change needed)
#   - Behavioral cloning removed (re-record a V2 demo if you want it back)

environment_parameters:
  drone_curriculum_stage: 4.0

behaviors:
  DroneAgentV2:
    trainer_type: ppo

    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 3.0e-4
      beta: 1.0e-4
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 10000000
    time_horizon: 512
    summary_freq: 10000
    keep_checkpoints: 5

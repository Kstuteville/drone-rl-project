# ML-Agents training configuration for PPODroneController
# Run with: mlagents-learn config/drone_training.yaml --run-id=drone_ppo_v1
#
# Kaylie: Tune these hyperparameters based on training results.
# Monitor with: tensorboard --logdir results

env_settings:
  num_envs: 1
  num_areas: 8


behaviors:
  DroneAgent:
    trainer_type: ppo

    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 3.0e-4
      beta: 5.0e-3          # Entropy regularization
      epsilon: 0.2           # PPO clip parameter
      lambd: 0.95            # GAE lambda
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true        # Normalize observations
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 10000000
    time_horizon: 512
    summary_freq: 10000
    keep_checkpoints: 5


    
